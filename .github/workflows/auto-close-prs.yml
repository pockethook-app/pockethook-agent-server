name: Auto-close pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    if: github.event.pull_request.author_association != 'OWNER' && github.event.pull_request.author_association != 'MEMBER' && github.event.pull_request.author_association != 'COLLABORATOR'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const author = context.payload.pull_request.user.login;
            const body = [
              `Hi @${author}, thanks for your interest in PocketHook!`,
              ``,
              `This project doesn't accept pull requests right now — see [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) for the policy.`,
              ``,
              `If you found a bug or have a question, please [open an issue](../../issues/new/choose) instead. If you've built something interesting on top of this, fork freely (MIT) and share it in an issue.`,
            ].join('\n');
            await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            await github.rest.pulls.update({ owner, repo, pull_number: prNumber, state: 'closed' });
